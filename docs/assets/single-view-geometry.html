    const scale = Math.min((width - 2 * marginX) / (right - left), (heightPx - 2 * marginY) / (bottom - top));
    return (point) =&gt; [width / 2 + (point[0] - (left + right) / 2) * scale,

  function prism(x, y, z, across, depth, rise) {
    return [[x, y, z], [x + across, y, z], [x + across, y + depth, z], [x, y + depth, z],

  }

  const board = prism(-1.10, .40, -.045, 2.10, 1.50, .045);
  const reference = prism(-.47, .85, 0, .34, .31, .20);
  const target = prism(.32, 1.55, 0, .34, .31, .30);
  const eye = [0, -2.8, 1.0];

  const worldEqual = [target[0][0], target[0][1], .2];
  // This is the generating camera of pitched_staggered/scene.json.
  const cameraRotation = [
    [.9878972377, -.1461952414, -.0518266263],
    [-.0711692336, -.1303460449, -.9889109408],
    [.1378186779, .9806308480, -.1391731010],
  ];
  function pinhole(vertex) {
    const ray = vertex.map((value, i) =&gt; value - eye[i]);
    const [x, y, z] = cameraRotation.map((row) =&gt; row.reduce((sum, cell, i) =&gt; sum + cell * ray[i], 0));
    return [1000 + 1600 * x / z, 650 + 1600 * y / z];

  function spatialLayout() {
    const cosine = Math.cos(yaw);
    const sine = Math.sin(yaw);
    function rotate([x, y, z]) {

      return [x * cosine - y * sine, -depth * Math.sin(pitch) - z * Math.cos(pitch),

    const fit = projection([...board, ...reference, ...target].map(rotate), width &lt; 450 ? 23 : 46, 48);
    return {point: (vertex) =&gt; fit(rotate(vertex)), rotate};

  function paintSolids(solids, point, rotate) {

    const surfaces = solids.flatMap(([solid, color]) =&gt; faces.map((face, index) =&gt; {
      const vertices = face.map((i) =&gt; solid[i]);
      const depth = vertices.reduce((sum, v) =&gt; sum + rotate(v)[2], 0) / vertices.length;
      return { vertices, color, depth, index };
    }));
    surfaces.sort((a, b) =&gt; b.depth - a.depth).forEach(({vertices, color, index}) =&gt; {
      outline(vertices.map(point), color, palette.edge, index === 4 ? .12 : .29);
    });

  function drawSlab(floorPoints) {
    outline(floorPoints, palette.plane, palette.edge, .075);
    floorPoints.forEach((point) =&gt; markedPoint(point, palette.plane, 3.5));
  }

  function measureAxes(ref, target, weight = 3.5, radius = 4.6, outlineWidth = 2) {
    segment(ref[0], ref[1], palette.reference, weight);
    segment(target[0], target[1], palette.target, weight);
    ref.forEach((point) =&gt; markedPoint(point, palette.reference, radius, outlineWidth));
    target.forEach((point) =&gt; markedPoint(point, palette.target, radius, outlineWidth));

  function spatialModel() {
    const {point, rotate} = spatialLayout();
    paintSolids([[board, palette.ink]], point, rotate);
    paintSolids([[reference, palette.reference], [target, palette.target]], point, rotate);
    worldFloor.forEach((corner) =&gt; markedPoint(point(corner), palette.plane, 3.5));
    measureAxes([reference[0], reference[4]].map(point), [target[0], target[4]].map(point));

    const a = point(reference[4]);
    const b = point(target[4]);
    label(&quot;参考箱 20 cm&quot;, [a[0] - 7, a[1] - 14], &quot;right&quot;);

  function detailLayout() {

    segment(base, top, palette.target, 4.8);

    markedPoint(equal, palette.transfer, 6);

  function drawMovement() {
    const picture = currentPose();
    context.save();
    context.globalAlpha = picture.plane;

    // pinhole camera that generated the sample. The retained dots finish at
    // the measured image points, including their small detection offsets.

    picture.ref.forEach((point) =&gt; markedPoint(point, palette.reference, 4.8));
    context.restore();
    segment(picture.target[0], picture.target[1], palette.target, 4.5);
    picture.target.forEach((point) =&gt; markedPoint(point, palette.target, 5.1));

      context.save();
      context.globalAlpha = picture.ruler;
      segment(picture.target[0], picture.equal, palette.transfer, 4.7);

  function resize() {

    heightPx = bounds.height;

  function show(step, animate = true, remember = false) {
    const next = Math.max(0, Math.min(description.length - 1, step));
    const canAnimate = animate &amp;&amp; !reducedMotion.matches &amp;&amp; width &gt; 0;
    const move = canAnimate &amp;&amp; next !== stage &amp;&amp; (stage &gt;= 2 || next &gt;= 2);

      if (!playing) return;

  function startPlayback() {
    playing = true;
    play.textContent = &quot;暂停&quot;;

  }

  controls.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
    stop();
    show(Number(button.dataset.step), true, true);
